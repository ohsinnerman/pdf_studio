# Runs on every push and pull request.
#
#   web      — typecheck, lint, format, tests, version check, frontend build (Linux, fast)
#   rust     — rustfmt, clippy, Rust tests (Windows, the platform we ship)
#   windows  — builds the real NSIS installer and uploads the .exe as a workflow artifact
#
# See docs/RELEASING.md for how CI relates to releases.
name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*'] # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Versions agree
        run: node scripts/bump-version.mjs --check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build frontend
        run: npx vite build

  rust:
    name: Rust checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context!() embeds the built frontend, so it must exist before cargo runs.
      - run: npm ci
      - run: npx vite build

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  windows:
    name: Windows installer
    needs: [web, rust]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        run: npm run app:build -- --bundles nsis

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Download it from the run's summary page ("Artifacts"). Kept for 30 days.
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-studio-${{ steps.version.outputs.value }}-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

# Builds the Windows installer and attaches it to a DRAFT GitHub Release.
#
# Trigger: push a tag that matches the app version, e.g.
#   git tag v1.0.9-pre-alpha && git push origin v1.0.9-pre-alpha
# or run it by hand from the Actions tab.
#
# The release stays a draft until you publish it on GitHub, so nothing is
# public by accident. Versions with a pre-release tag (anything with "-")
# are marked as pre-releases. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the .exe

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and release (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Version files agree
        run: node scripts/bump-version.mjs --check

      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v${version}. Run npm run version:bump first."
            exit 1
          fi

      - name: Pre-release?
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: PDF Studio v__VERSION__
          releaseBody: |
            Windows installer for PDF Studio v__VERSION__.

            **Install:** download `PDF Studio_*_x64-setup.exe` below and run it. It installs for your user only; no admin rights are needed.

            The installer isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC". Choose **More info → Run anyway**.

            What changed: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v__VERSION__/CHANGELOG.md).
          releaseDraft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          args: --bundles nsis

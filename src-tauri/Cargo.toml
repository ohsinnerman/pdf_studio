[package]
name = "pdf-studio"
version = "1.0.6-pre-alpha"
description = "A free, offline desktop PDF editor for Windows."
authors = ["Akul Shrivastava"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ohsinnerman/pdf_studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "pdf_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
percent-encoding = "2"

[profile.release]
# Smaller, faster release binary. Slower to compile, which only matters in CI.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
